<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>That last module solver</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			background: #111;
			color: #eee;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 24px;
		}

		.controls {
			margin-bottom: 20px;
		}

		input {
			width: 80px;
			padding: 6px;
			margin: 0 8px;
			font-size: 16px;
		}

		button {
			padding: 6px 12px;
			font-size: 16px;
			cursor: pointer;
		}

		.info {
			margin: 12px 0;
			font-family: monospace;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(7, 30px);
			grid-template-rows: repeat(7, 30px);
			gap: 4px;
		}

		.cell {
			width: 30px;
			height: 30px;
			background: #ffffff;
			border-radius: 4px;
		}

		.cell.on {
			background: #de4a4a;
		}
	</style>
</head>

<body>

	<h1>That last module solver</h1>

	<div class="controls">
		Vertical:
		<input id="vertical" type="number" value="6" onchange="update()"/>
		Horizontal:
		<input id="horizontal" type="number" value="7" onchange="update()"/>
	</div>

	<div class="info" id="binaryInfo"></div>

	<div class="grid" id="grid"></div>

	<script>
		function to7bit(n) {
			return n
				.toString(2)
				.padStart(7, "0")
				.split("")
				.map(Number);
		}

		function update() {
			const v = to7bit(parseInt(document.getElementById("vertical").value, 10));
			const h = to7bit(parseInt(document.getElementById("horizontal").value, 10)).reverse();

			document.getElementById("binaryInfo").textContent = `Vertical: ${v.join("")} | Horizontal: ${h.join("")}`;

			const grid = document.getElementById("grid");
			grid.innerHTML = "";

			for (let row = 0; row < 7; row++) {
				for (let col = 0; col < 7; col++) {
					const cell = document.createElement("div");
					cell.className = "cell";
					if (h[col] | v[row]) { cell.classList.add("on"); }
					grid.appendChild(cell);
				}
			}
		}

		update();
	</script>

</body>

</html>
